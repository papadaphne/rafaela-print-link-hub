    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
        opacity: 0;
      }
      @keyframes glow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }
        50% {
          box-shadow: 0 0 30px rgba(34, 211, 238, 0.7);
        }
      }
      .animate-glow-primary {
        animation: glow 3s ease-in-out infinite;
      }
      
      /* --- Cyberpunk/Lightsaber Button Style --- */
      .cyber-button {
        position: relative;
        overflow: hidden;
        z-index: 1;
        background: linear-gradient(to right, #10b981, #059669);
        border: 1px solid rgba(16, 185, 129, 0.5);
      }

      .cyber-button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 250%; /* Larger for a wider sweep */
        height: 250%;
        z-index: -1;
        background: conic-gradient(
          transparent,
          rgba(59, 255, 203, 0.8), /* Brighter cyan-green light */
          transparent 20%
        );
        animation: rotate-saber 4s linear infinite;
      }

      @keyframes rotate-saber {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
    </style>
